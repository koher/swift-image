name: "Tests"

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-os:
    name: macOS and iOS (Swift 6.4)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Set up Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
      - name: Build for macOS
        run: swift build -c release -v
      - name: Test for macOS
        run: swift test -c release -v
      - name: Build for iOS
        run: xcodebuild -scheme SwiftImage -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' build
      - name: Test on iOS Simulator
        run: xcodebuild -scheme SwiftImage -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' test

  linux:
    name: Linux (Swift 6.4)
    runs-on: ubuntu-24.04
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Build for Linux
        run: swift build -c release -v
      - name: Test for Linux
        run: swift test -c release -v
